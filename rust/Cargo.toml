[workspace]
resolver = "2"
members = ["crates/vs-core", "crates/vs-bin", "crates/vsd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
image = "0.25"
ndarray = "0.16"
rayon = "1"
vtracer = "1.0.0-alpha.4"
regex = "1"
landlock = "0.4"
rustix = "1"
nix = { version = "0.31", features = ["sched", "mount"] }
seccompiler = "0.5"
ort = "2.0.0-rc.13"
